<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>

  <!-- Header Bar -->
  <div class="header-bar">
    <h2>WebShortcuts</h2>
    <button id="themeToggleBtn" class="theme-toggle-btn" title="Toggle Theme">◐</button>
  </div>

  <!-- Creator Panel Workspace -->
  <div class="creator-box">
    <input type="text" id="shortcutTitle" placeholder="Shortcut Title (e.g., PiP Toggle)">
    <textarea id="shortcutCode" placeholder="// Write custom script code here..."></textarea>
    <button id="addShortcutBtn" class="action-btn">Save to Gallery</button>
  </div>

  <!-- Gallery Grid Matrix -->
  <h3>Shortcuts Gallery (Drag to reorder / Click to run)</h3>
  <div id="shortcutsGrid" class="kachel-grid"></div>

  <!-- 1. Inline Editor Modal Overlay -->
  <div id="editorModal" class="custom-modal">
    <div class="creator-box" style="width: 100%;">
      <h3 style="margin:0 0 4px 0; font-size:14px;">Edit Shortcut</h3>
      <input type="text" id="editTitle">
      <textarea id="editCode" style="height:120px;"></textarea>
      <div style="display:flex; gap:6px;">
        <button id="saveEditBtn" class="action-btn" style="flex:2;">Update Save</button>
        <button id="cancelEditBtn" class="action-btn" style="background:#86868b; flex:1;">Cancel</button>
      </div>
    </div>
  </div>

  <!-- 2. Custom Delete Confirmation Modal Overlay -->
  <div id="deleteModal" class="custom-modal">
    <div class="creator-box" style="width: 100%; text-align: center; gap: 12px;">
      <h3 id="deleteModalTitle" style="margin:0; font-size:14px; text-transform:none; color:var(--text-main);">Delete Shortcut?</h3>
      <p style="margin:0; font-size:12px; color:var(--text-sub);">Are you sure you want to permanently remove this shortcut from your gallery?</p>
      <div style="display:flex; gap:6px; width:100%;">
        <button id="confirmDeleteBtn" class="action-btn" style="background:#ff3b30; flex:1;">Delete</button>
        <button id="cancelDeleteBtn" class="action-btn" style="background:#86868b; flex:1;">Cancel</button>
      </div>
    </div>
  </div>

  <div id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
